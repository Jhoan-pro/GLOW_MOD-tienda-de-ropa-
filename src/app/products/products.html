<section class="products">

  <div class="header">
    <h2>Productos</h2>
    <button class="add-btn" (click)="openCreate()">Agregar producto</button>
  </div>

  <table class="products-table">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Precio</th>
        <th>Stock</th>
        <th>Categoría</th>
        <th>Acciones</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let p of products; let i = index">
        <td>{{ p.name }}</td>
        <td>{{ p.price }}</td>
        <td>{{ p.stock }}</td>
        <td>{{ p.category }}</td>
        <td>
          <button (click)="openEdit(i)">Editar</button>
          <button (click)="deleteProduct(i)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="modal" *ngIf="showModal">
    <div class="modal-content">

      <app-product-form
        [product]="currentProduct"
        (save)="saveProduct($event)"
        (cancel)="closeModal()">
      </app-product-form>

    </div>
  </div>

</section>
