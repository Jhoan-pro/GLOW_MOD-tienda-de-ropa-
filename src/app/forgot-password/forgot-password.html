<div class="body">
  <div class="login-container">

  <h2>Recuperar contraseña</h2>
  <p>Ingresa tu correo para enviar enlace de recuperación</p>

  <input
    type="email"
    placeholder="Correo electrónico"
    [(ngModel)]="email"
  >

  <button class="login-btn" (click)="sendRecovery()">
    Enviar enlace
  </button>

  <p class="error-msg">{{ message }}</p>

  <a routerLink="/login" class="back-login">
    Volver al inicio
  </a>

</div>

</div>
