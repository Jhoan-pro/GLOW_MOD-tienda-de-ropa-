
<div class="login-container">

  <div class="login-box">
    <h2>Iniciar Sesión</h2>

    <input 
      type="email" 
      placeholder="Correo electrónico"
      [(ngModel)]="email"
    >

    <input 
      type="password" 
      placeholder="Contraseña"
      [(ngModel)]="password"
    >

   <a href="/forgot-password" class="forgot-link">
  ¿Olvidaste tu contraseña?
  </a>

    <button class="primary-btn" (click)="login()">
      Ingresar
    </button>

    <p class="error-msg">{{ message }}</p>

    <div class="divider">Continuar con:</div>

    <div class="social-login">
      <button class="google-btn">
        <img src="assets/img/logoGoogle.png" alt="Google">
        Google
      </button>

      <button class="apple-btn">
        <img src="assets/img/logoApple.png" alt="Apple">
        Apple
      </button>

      <button class="facebook-btn">
        <img src="assets/img/logoFacebook.png" alt="Facebook">
        Facebook
      </button>
    </div>

  </div>

</div>
