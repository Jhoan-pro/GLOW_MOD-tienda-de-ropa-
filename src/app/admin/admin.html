<section class="overview">
  <h2 class="section-title">Resumen del Negocio</h2>

  <div class="stats-grid">
    <article class="stat-card">
      <span class="stat-label">Recaudo Total:</span>
      <span class="stat-value">{{ totalRecaudo | currency}}</span>
    </article>

    <article class="stat-card">
      <span class="stat-label">Total Productos:</span>
      <span class="stat-value">{{ totalProductos }}</span>
    </article>

    <article class="stat-card">
      <span class="stat-label">Total Clientes:</span>
      <span class="stat-value">{{ totalClientes }}</span>
    </article>
  </div>

  <div class="charts-area">
    <p>[Gráficos de ventas e inventario]</p>
  </div>
</section>
