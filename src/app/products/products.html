<section class="products">

  <div class="header">
    <h2>Productos</h2>
    <button class="add-btn" (click)="openModal()">Agregar producto</button>
  </div>

  <!-- TABLA -->
  <table class="products-table">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Precio</th>
        <th>Stock</th>
        <th>Categoría</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let p of products">
        <td>{{ p.name }}</td>
        <td>{{ p.price }}</td>
        <td>{{ p.stock }}</td>
        <td>{{ p.category }}</td>
      </tr>
    </tbody>
  </table>

  <!-- MODAL -->
  <div class="modal" *ngIf="showModal">
    <div class="modal-content">

      <h3>Agregar producto</h3>

      <input type="text" placeholder="Nombre" [(ngModel)]="newProduct.name">
      <input type="number" placeholder="Precio" [(ngModel)]="newProduct.price">
      <input type="number" placeholder="Stock" [(ngModel)]="newProduct.stock">
      <input type="text" placeholder="Categoría" [(ngModel)]="newProduct.category">
      <textarea placeholder="Descripción" [(ngModel)]="newProduct.description"></textarea>

      <div class="modal-actions">
        <button (click)="saveProduct()">Guardar</button>
        <button class="cancel" (click)="closeModal()">Cancelar</button>
      </div>

    </div>
  </div>

</section>
