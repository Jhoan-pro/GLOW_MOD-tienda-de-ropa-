<section class="product-car">
  <div class="product-card" *ngFor="let product of products; let i = index">
    <h3 class="product-name">{{ product.name }}</h3>
    <img [src]="product.image" alt="{{ product.name }}" class="product-image" />
    <p class="product-price">Precio: ${{ product.price }}</p>
    <p class="product-stock">
  <p class="product-stock">
  <span *ngIf="product.stock > 0">
    Stock: {{ product.stock }}
  </span>

  <span *ngIf="product.stock === 0" style="color:red;">
    Exhausted
  </span>
</p>
<button (click)="addToCart(product, i)">
  Agregar al carrito
</button>
    
  </div>
  <!-- MODAL LOGIN -->
<div class="modal-overlay" *ngIf="showLoginAlert">

  <div class="modal">

    <h3>Debes iniciar sesión</h3>
    <p>Para agregar productos al carrito primero debes iniciar sesión.</p>

    <div class="modal-actions">
      <button routerLink="/login">Ir a login</button>
      <button (click)="showLoginAlert = false">Cancelar</button>
    </div>

  </div>

</div>
</section>
