<header class="navbar">
  <div class="logo">
  <span class="logo-glow">GLOW</span><span class="logo-mod">_MOD</span>
</div>

  <div class="actions">
    <div class="cart-icon" (click)="toggleCarrito()">🛒</div>
    <!-- LUPA / FILTROS -->
    <div class="search-box">
      <button id="btn-lupa" (click)="toggleFiltros()">🔍</button>

      <div class="filtros-panel" *ngIf="mostrarFiltros">
        <h4>Filtros</h4>

        <label>
          Categoría
          <select>
            <option>Todos</option>
            <option>Camisetas</option>
            <option>Chaquetas</option>
          </select>
        </label>

        <label>
          Precio máximo
          <input type="range" min="0" max="200">
        </label>

        <label>
          Ordenar por
          <select>
            <option>Popularidad</option>
            <option>Precio</option>
          </select>
        </label>

        <button class="aplicar">Aplicar</button>
      </div>
    </div>
    
    <!-- USUARIO -->
    <div class="user-dropdown">
      <div class="user-icon" (click)="toggleMenuUsuario()">👤</div>

      <div class="dropdown-menu" *ngIf="menuUsuarioAbierto">
        <a routerLink="/user">Administrar cuenta</a>
        <a href="#">Tus pedidos</a>
        <a href="#">Reseñas</a>
        <a href="#">Historial</a>
        <a href="#">Ajustes</a>
        <button class="logout-btn" (click)="logout()">Salir</button>
      </div>
    </div>

  </div>
</header>
<div class="cart-panel" [class.open]="carritoAbierto">

  <h3>Tu carrito</h3>

  <!-- CONTENIDO SCROLL -->
  <div class="cart-content">

    <div class="cart-item">
      <img src="https://via.placeholder.com/60" alt="">
      <div class="info">
        <p>Chaqueta Urban</p>
        <span>$79.99</span>

        <div class="cantidad">
          <button>-</button>
          <span>2</span>
          <button>+</button>
        </div>

        <small class="eliminar">Eliminar</small>
      </div>
    </div>

  </div>

  <!-- FOOTER FIJO -->
  <div class="cart-footer">
    <p>Subtotal: <span>$159.98</span></p>
    <p>Total: <span>$159.98</span></p>

    <div class="acciones">
      <button class="cancelar" (click)="cerrarCarrito()">Cancelar</button>
      
      <button class="comprar">Comprar</button>
    </div>
  </div>

</div>
<div class="overlay" *ngIf="carritoAbierto" (click)="cerrarCarrito()"></div>
