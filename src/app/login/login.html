<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - GLOW_MOD</title>
<link rel="stylesheet" href="login.css">
</head>

<body class="login-container">

<div class="login-box">
  <h2>Iniciar Sesión</h2>

  <input type="email" id="email" placeholder="Correo electrónico">
  <input type="password" id="password" placeholder="Contraseña">

  


  <a href="./forgot-password" class="forgot-link">¿Olvidaste tu contraseña?</a>

  <button class="primary-btn" onclick="login()">Ingresar</button>

  <p id="errorMsg" class="error-msg"></p>

  <div class="divider">Continuar con:</div>

  <div class="social-login">
    <button class="google-btn"><img src="img/logoGoogle.png" alt="">Google</button>
    <button class="apple-btn"><img src="img/logoApple.png" alt="">Apple</button>
    <button class="facebook-btn"><img src="img/logoFacebook.png" alt="">Facebook</button>
  </div>
</div>


</body>
</html>
