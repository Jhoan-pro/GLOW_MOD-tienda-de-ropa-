<section class="catalog-wrapper" id="catalogo">
  <section
    class="category-section"
    *ngFor="let category of categories"
    [attr.id]="slugify(category)"
  >
    <div class="category-header">
      <div>
        <h2 class="category-title">{{ category }}</h2>
        <p class="category-subtitle">
          {{ getProductsByCategory(category).length }} productos disponibles
        </p>
      </div>
    </div>

    <div class="carousel-wrapper">
      <button
        *ngIf="shouldEnableCarousel(category)"
        class="arrow left"
        (click)="scrollCategory(category, -350)"
      >
        ❮
      </button>

      <div
        class="product-carousel"
        [attr.id]="carouselId(category)"
        [ngClass]="{ 'center-products': shouldCenterProducts(category) }"
      >
        <article
          class="product-card"
          *ngFor="let product of getProductsByCategory(category); trackBy: trackById"
        >
          <img
            [src]="product.image || 'assets/no-image.png'"
            [alt]="product.name"
            class="product-image"
          />

          <div class="product-info">
            <h3 class="product-name">{{ product.name }}</h3>
            <p class="product-price">Precio: ${{ product.price }}</p>

            <p class="product-stock">
              <span *ngIf="product.stock > 0">Stock: {{ product.stock }}</span>
              <span *ngIf="product.stock === 0" class="sold-out">Agotado</span>
            </p>

            <button
              *ngIf="!isAdminView"
              class="add-btn"
              [disabled]="product.stock === 0"
              [ngClass]="{ added: product.added }"
              (click)="addToCart(product)"
            >
              <span *ngIf="product.stock > 0">Agregar</span>
              <span *ngIf="product.stock === 0">Sin stock</span>
            </button>

            <p *ngIf="isAdminView" class="admin-note">Modo vista previa</p>
          </div>
        </article>
      </div>

      <button
        *ngIf="shouldEnableCarousel(category)"
        class="arrow right"
        (click)="scrollCategory(category, 350)"
      >
        ❯
      </button>
    </div>
  </section>
</section>

<div class="login-alert-overlay" *ngIf="showLoginAlert" (click)="closeLoginAlert()">
  <div class="login-alert-card" (click)="$event.stopPropagation()">
    <h3>Debes iniciar sesión</h3>
    <p>Para agregar productos al carrito primero debes iniciar sesión.</p>

    <div class="login-alert-actions">
      <button class="go-login-btn" (click)="goToLogin()">Ir a login</button>
      <button class="cancel-btn" (click)="closeLoginAlert()">Cancelar</button>
    </div>
  </div>
</div>
