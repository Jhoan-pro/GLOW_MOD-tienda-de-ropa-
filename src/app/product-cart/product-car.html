<section *ngFor="let category of categories" class="category-section">
  <h2 class="category-title">{{ category }}</h2>

  <div class="product-car">
    <div
      class="product-card"
      *ngFor="let product of getProductsByCategory(category)"
    >
      <h3 class="product-name">{{ product.name }}</h3>

      <img
        [src]="product.image"
        alt="{{ product.name }}"
        class="product-image"
      />

      <p class="product-price">Precio: ${{ product.price }}</p>

      <p class="product-stock">
        <span *ngIf="product.stock > 0">
          Stock: {{ product.stock }}
        </span>

        <span *ngIf="product.stock === 0" style="color: red">
          Agotado
        </span>
      </p>

      <button
        class="add-btn"
        [disabled]="product.stock === 0"
        [ngClass]="{ added: product.added }"
        (click)="addToCart(product)"
      >
        <span *ngIf="product.stock > 0">Agregar</span>
        <span *ngIf="product.stock === 0">Sin stock</span>
      </button>
    </div>
  </div>
</section>
